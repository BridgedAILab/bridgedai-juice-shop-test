name: "CI/CD Pipeline"
on:
  push:
    branches-ignore:
      - l10n_develop
      - gh-pages
    paths-ignore:
      - '*.md'
      - 'LICENSE'
      - 'monitoring/grafana-dashboard.json'
      - 'screenshots/**'
    tags-ignore:
      - '*'
  pull_request:
    paths-ignore:
      - '*.md'
      - 'LICENSE'
      - 'data/static/i18n/*.json'
      - 'frontend/src/assets/i18n/*.json'
env:
  NODE_DEFAULT_VERSION: 24
  NODE_OPTIONS: "--max_old_space_size=4096"
  CYCLONEDX_NPM_VERSION: '^2.0.0||^3.0.0||^4.0.0'   # keep in sync with package.json
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: "Check out Git repository"
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 #v4.2.2
      - name: "Use Node.js"
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af #v4.1.0
        with:
          node-version: ${{ env.NODE_DEFAULT_VERSION }}
      - name: "Install application minimalistically"
        run: |
          npm install --ignore-scripts
          cd frontend
          npm install --ignore-scripts
      - name: "Lint source code"
        run: npm run lint
  coding-challenge-rsn:
    runs-on: windows-latest
    steps:
      - name: "Check out Git repository"
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 #v4.2.2
      - name: "Use Node.js"
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af #v4.1.0
        with:
          node-version: ${{ env.NODE_DEFAULT_VERSION }}
      - name: "Install application"
        run: npm install
      - name: "Check coding challenges for accidental code discrepancies"
        run: npm run rsn
  frontend-test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node-version: [22, 24, 26]
    steps:
      - name: "Check out Git repository"
        if: github.repository == 'juice-shop/juice-shop' || (github.repository != 'juice-shop/juice-shop' && matrix.os == 'ubuntu-latest' && matrix.node-version == '24')
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 #v4.2.2
      - name: "Use Node.js ${{ matrix.node-version }}"
        if: github.repository == 'juice-shop/juice-shop' || (github.repository != 'juice-shop/juice-shop' && matrix.os == 'ubuntu-latest' && matrix.node-version == '24')
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af #v4.1.0
        with:
          node-version: ${{ matrix.node-version }}
      - name: "Install application"
        if: github.repository == 'juice-shop/juice-shop' || (github.repository != 'juice-shop/juice-shop' && matrix.os == 'ubuntu-latest' && matrix.node-version == '24')
        run: npm install
      - name: "Execute frontend unit tests"
        if: github.repository == 'juice-shop/juice-shop' || (github.repository != 'juice-shop/juice-shop' && matrix.os == 'ubuntu-latest' && matrix.node-version == '24')
        uses: nick-invision/retry@7152eba30c6575329ac0576536151aca5a72780e #v3.0.0
        with:
          shell: bash
          timeout_minutes: 10
          max_attempts: 3
          command: npm run test:frontend:coverage
      - name: "Copy frontend unit test coverage data"
        if: github.repository == 'juice-shop/juice-shop' && github.event_name == 'push' && matrix.os == 'ubuntu-latest' && matrix.node-version == '24'
        run: |
          cp frontend/coverage/frontend/lcov.info frontend-lcov.info
          sed -i s/SF:/SF:frontend\\//g frontend-lcov.info
        shell: bash
      - name: "Upload frontend unit test coverage data"
        if: github.repository == 'juice-shop/juice-shop' && github.event_name == 'push' && matrix.os == 'ubuntu-latest' && matrix.node-version == '24'
        uses: actions/upload-artifact@6f51ac03b9356f520e9adb1b1b7802705f340c2b #v4.5.0
        with:
          name: frontend-test-lcov
          path: |
            frontend-lcov.info
  server-test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node-version: [22, 24, 26]
    steps:
      - name: "Check out Git repository"
        if: github.repository == 'juice-shop/juice-shop' || (github.repository != 'juice-shop/juice-shop' && matrix.os == 'ubuntu-latest' && matrix.node-version == '24')
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 #v4.2.2
      - name: "Use Node.js ${{ matrix.node-version }}"
        if: github.repository == 'juice-shop/juice-shop' || (github.repository != 'juice-shop/juice-shop' && matrix.os == 'ubuntu-latest' && matrix.node-version == '24')
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af #v4.1.0
        with:
          node-version: ${{ matrix.node-version }}
      - name: "Install application"
        if: github.repository == 'juice-shop/juice-shop' || (github.repository != 'juice-shop/juice-shop' && matrix.os == 'ubuntu-latest' && matrix.node-version == '24')
        run: npm install
      - name: "Execute server unit tests"
        if: github.repository == 'juice-shop/juice-shop' || (github.repository != 'juice-shop/juice-shop' && matrix.os == 'ubuntu-latest' && matrix.node-version == '24')
        uses: nick-invision/retry@7152eba30c6575329ac0576536151aca5a72780e #v3.0.0
        with:
          timeout_minutes: 10
          max_attempts: 3
          command: npm run test:server:coverage
      - name: "Copy server unit test coverage data"
        if: github.repository == 'juice-shop/juice-shop' && github.event_name == 'push' && matrix.os == 'ubuntu-latest' && matrix.node-version == '24'
        run: |
          cp coverage/server-tests/lcov.info server-lcov.info
        shell: bash
      - name: "Upload server unit test coverage data"
        if: github.repository == 'juice-shop/juice-shop' && github.event_name == 'push' && matrix.os == 'ubuntu-latest' && matrix.node-version == '24'
        uses: actions/upload-artifact@6f51ac03b9356f520e9adb1b1b7802705f340c2b #v4.5.0
        with:
          name: server-test-lcov
          path: |
            server-lcov.info
  api-test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node-version: [22, 24, 26]
    steps:
      - name: "Check out Git repository"
        if: github.repository == 'juice-shop/juice-shop' || (github.repository != 'juice-shop/juice-shop' && matrix.os == 'ubuntu-latest' && matrix.node-version == '24')
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 #v4.2.2
      - name: "Use Node.js ${{ matrix.node-version }}"
        if: github.repository == 'juice-shop/juice-shop' || (github.repository != 'juice-shop/juice-shop' && matrix.os == 'ubuntu-latest' && matrix.node-version == '24')
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af #v4.1.0
        with:
          node-version: ${{ matrix.node-version }}
      - name: "Install application"
        if: github.repository == 'juice-shop/juice-shop' || (github.repository != 'juice-shop/juice-shop' && matrix.os == 'ubuntu-latest' && matrix.node-version == '24')
        run: npm install
      - name: "Execute integration tests"
        if: github.repository == 'juice-shop/juice-shop' || (github.repository != 'juice-shop/juice-shop' && matrix.os == 'ubuntu-latest' && matrix.node-version == '24')
        uses: nick-invision/retry@7152eba30c6575329ac0576536151aca5a72780e #v3.0.0
        env:
          NODE_ENV: test
          ALCHEMY_API_KEY: ${{ secrets.ALCHEMY_API_KEY }}
        with:
          timeout_minutes: 5
          max_attempts: 3
          command: npm run test:api:coverage
      - name: "Copy API test coverage data"
        if: github.repository == 'juice-shop/juice-shop' && github.event_name == 'push' && matrix.os == 'ubuntu-latest' && matrix.node-version == '24'
        run: cp coverage/api-tests/lcov.info api-lcov.info
      - name: "Upload API test coverage data"
        if: github.repository == 'juice-shop/juice-shop' && github.event_name == 'push' && matrix.os == 'ubuntu-latest' && matrix.node-version == '24'
        uses: actions/upload-artifact@6f51ac03b9356f520e9adb1b1b7802705f340c2b #v4.5.0
        with:
          name: api-test-lcov
          path: |
            api-lcov.info
  coverage-report:
    needs: [frontend-test, server-test, api-test]
    runs-on: ubuntu-latest
    if: github.repository == 'juice-shop/juice-shop' && github.event_name == 'push'
    steps:
      - name: "Check out Git repository"
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 #v4.2.2
      - name: "Download frontend test coverage data"
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 #v4.1.8
        with:
          name: frontend-test-lcov
      - name: "Download server test coverage data"
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 #v4.1.8
        with:
          name: server-test-lcov
      - name: "Download API test coverage data"
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 #v4.1.8
        with:
          name: api-test-lcov
      - name: "Publish coverage to Coveralls"
        uses: coverallsapp/github-action@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          files: frontend-lcov.info server-lcov.info api-lcov.info
  custom-config-test:
    runs-on: ubuntu-latest
    steps:
      - name: "Check out Git repository"
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 #v4.2.2
      - name: "Use Node.js"
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af #v4.1.0
        with:
          node-version: ${{ env.NODE_DEFAULT_VERSION }}
      - name: "Install application"
        run: npm install
      - name: "Execute server tests for each custom configuration"
        uses: nick-invision/retry@7152eba30c6575329ac0576536151aca5a72780e #v3.0.0
        with:
          timeout_minutes: 30
          max_attempts: 3
          command: >
            NODE_ENV=7ms npm run test:server &&
            NODE_ENV=addo npm run test:server &&
            NODE_ENV=bodgeit npm run test:server &&
            NODE_ENV=ctf npm run test:server &&
            NODE_ENV=fbctf npm run test:server &&
            NODE_ENV=juicebox npm run test:server &&
            NODE_ENV=mozilla npm run test:server &&
            NODE_ENV=oss npm run test:server &&
            NODE_ENV=quiet npm run test:server &&
            NODE_ENV=tutorial npm run test:server &&
            NODE_ENV=unsafe npm run test:server
  e2e-test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        browser: [chrome] # FIXME Switch back to [chrome, firefox] after debugging extreme flakiness of Firefox on CI/CD
      fail-fast: false
    steps:
      - name: "Check out Git repository"
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 #v4.2.2
      - name: "Use Node.js"
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af #v4.1.0
        with:
          node-version: ${{ env.NODE_DEFAULT_VERSION }}
      - name: "Install CLI tools"
        run: npm install -g @angular/cli
      - name: "Install application"
        run: npm install
      - name: "Execute end-to-end tests on Ubuntu"
        if: ${{ matrix.os == 'ubuntu-latest' }}
        uses: cypress-io/github-action@57b70560982e6a11d23d4b8bec7f8a487cdbb71b #v6.7.8
        with:
          install: false
          browser: ${{ matrix.browser }}
          start: npm start
          wait-on: http://localhost:3000
          record: ${{ secrets.CYPRESS_RECORD_KEY != '' }}
          group: ${{ secrets.CYPRESS_RECORD_KEY != '' && format('{0} @ {1}', matrix.browser, matrix.os) || '' }}
        env:
          SOLUTIONS_WEBHOOK: ${{ secrets.E2E_SOLUTIONS_WEBHOOK }}
          ALCHEMY_API_KEY: ${{ secrets.ALCHEMY_API_KEY }}
          CYPRESS_RECORD_KEY: ${{ secrets.CYPRESS_RECORD_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: "Execute end-to-end tests on Mac"
        if: ${{ matrix.os == 'macos-latest' }}
        uses: cypress-io/github-action@57b70560982e6a11d23d4b8bec7f8a487cdbb71b #v6.7.8
        with:
          install: false
          browser: ${{ matrix.browser }}
          start: npm start
          wait-on: http://localhost:3000
          record: ${{ secrets.CYPRESS_RECORD_KEY != '' }}
          group: ${{ secrets.CYPRESS_RECORD_KEY != '' && format('{0} @ {1}', matrix.browser, matrix.os) || '' }}
        env:
          CYPRESS_CACHE_FOLDER: /Users/runner/Library/Caches/Cypress
          ALCHEMY_API_KEY: ${{ secrets.ALCHEMY_API_KEY }}
          CYPRESS_RECORD_KEY: ${{ secrets.CYPRESS_RECORD_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  smoke-test:
    runs-on: ubuntu-latest
    env:
      TYPESCRIPT_VERSION: '^6.0.3' # keep in sync with package.json
    steps:
      - name: "Check out Git repository"
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 #v4.2.2
      - name: "Use Node.js"
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af #v4.1.0
        with:
          node-version: ${{ env.NODE_DEFAULT_VERSION }}
      - name: "Install CLI tools"
        run: |
          npm install -g typescript@${{ env.TYPESCRIPT_VERSION }}
          npm install -g @cyclonedx/cyclonedx-npm@$CYCLONEDX_NPM_VERSION
          npm install -g grunt-cli
      - name: "Set packaging options for Grunt"
        run: |
          echo "PCKG_OS_NAME=linux" >> $GITHUB_ENV
          echo "PCKG_NODE_VERSION=24" >> $GITHUB_ENV
          echo "PCKG_CPU_ARCH=x64" >> $GITHUB_ENV
      - name: "Package application"
        run: |
          npm install --production
          npm run package:ci
      - name: "Unpack application archive"
        run: |
          cd dist
          tar -zxf juice-shop-*.tgz
      - name: "Execute smoke test"
        run: |
          cd dist/juice-shop_*
          npm start &
          cd ../..
          chmod +x test/smoke/smoke-test.sh
          test/smoke/smoke-test.sh http://localhost:3000
  docker-test:
    runs-on: ubuntu-latest
    steps:
      - name: "Check out Git repository"
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 #v4.2.2
      - name: "Execute smoke test on Docker"
        run: docker compose -f docker-compose.test.yml up --exit-code-from sut
  bridgedai-governance:
    name: "BridgedAI governance evidence"
    runs-on: ubuntu-latest
    needs:
      - lint
      - coding-challenge-rsn
      - frontend-test
      - server-test
      - api-test
      - custom-config-test
      - e2e-test
      - smoke-test
      - docker-test
    if: ${{ always() }}
    permissions:
      contents: read
      id-token: write
      attestations: write
      security-events: read
    env:
      BRIDGEDAI_API_URL: ${{ vars.BRIDGEDAI_API_URL || 'https://api.bridgedai.io' }}
      BRIDGEDAI_ORG_ID: ${{ vars.BRIDGEDAI_ORG_ID || 'org_a402b4f0-ac68-4d15-91de-44cc67ce3ebd' }}
      BRIDGEDAI_PROJECT_ID: ${{ vars.BRIDGEDAI_PROJECT_ID || 'proj_18139069-31bb-468f-8477-dc36cd54b33d' }}
      BRIDGEDAI_POLICY: ${{ vars.BRIDGEDAI_POLICY || 'release-governance-standard' }}
      BRIDGEDAI_ENVIRONMENT: ${{ github.ref == 'refs/heads/master' && 'Production' || 'CI' }}
      BRIDGEDAI_GATE_MODE: ${{ github.ref == 'refs/heads/master' && 'enforce' || 'warn' }}
    steps:
      - name: "Check out Git repository"
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 #v4.2.2
      - name: "Prepare BridgedAI evidence workspace"
        run: mkdir -p .bridgedai
      - name: "BridgedAI Auth"
        id: bridgedai-auth
        uses: bridgedai-devsecops/auth-action@v0.0.6-beta
        with:
          api-url: ${{ env.BRIDGEDAI_API_URL }}
          tenant: ${{ env.BRIDGEDAI_ORG_ID }}
          organization-id: ${{ env.BRIDGEDAI_ORG_ID }}
          audience: bridgedai-github-actions
          bridgedai-token: ${{ secrets.BRIDGEDAI_API_KEY || secrets.BRIDGEDAI_TOKEN }}
          auth-mode: ${{ (secrets.BRIDGEDAI_API_KEY != '' || secrets.BRIDGEDAI_TOKEN != '') && 'api-key' || 'oidc' }}
          use-github-oidc: true
          fail-on-auth-error: true
          signals-file: .bridgedai/signals.jsonl
      - name: "BridgedAI Collect Context"
        id: bridgedai-collect-context
        uses: bridgedai-devsecops/collect-context-action@v0.0.6-beta
        with:
          organization-id: ${{ env.BRIDGEDAI_ORG_ID }}
          output-file: .bridgedai/context.json
          signals-file: .bridgedai/signals.jsonl
          emit-demo-signals: false
      - name: "BridgedAI Register Runner"
        id: bridgedai-register-runner
        uses: bridgedai-devsecops/register-runner-action@v0.0.6-beta
        with:
          api-url: ${{ env.BRIDGEDAI_API_URL }}
          access-token: ${{ steps.bridgedai-auth.outputs.access-token }}
          api-key: ${{ steps.bridgedai-auth.outputs.api-key }}
          organization-id: ${{ env.BRIDGEDAI_ORG_ID }}
          project-id: ${{ env.BRIDGEDAI_PROJECT_ID }}
          mode: production
          fail-on-error: false
          emit-demo-signals: false
      - name: "BridgedAI Register Build"
        id: bridgedai-register-build
        uses: bridgedai-devsecops/register-build-action@v0.0.6-beta
        with:
          api-base: ${{ env.BRIDGEDAI_API_URL }}
          access-token: ${{ steps.bridgedai-auth.outputs.access-token }}
          api-key: ${{ steps.bridgedai-auth.outputs.api-key }}
          org-id: ${{ env.BRIDGEDAI_ORG_ID }}
          repo-full-name: ${{ github.repository }}
          workflow-run-id: ${{ github.run_id }}
          commit-sha: ${{ github.sha }}
          branch: ${{ github.ref_name }}
          workflow-name: ${{ github.workflow }}
          workflow-path: .github/workflows/ci.yml
          status: in_progress
      - name: "BridgedAI Subject"
        id: bridgedai-subject
        uses: bridgedai-devsecops/subject-action@v0.0.6-beta
        with:
          subject: package.json
          subject-type: file
      - name: "BridgedAI Register Artifact"
        id: bridgedai-register-artifact
        uses: bridgedai-devsecops/register-artifact-action@v0.0.6-beta
        with:
          api-url: ${{ env.BRIDGEDAI_API_URL }}
          access-token: ${{ steps.bridgedai-auth.outputs.access-token }}
          api-key: ${{ steps.bridgedai-auth.outputs.api-key }}
          organization-id: ${{ env.BRIDGEDAI_ORG_ID }}
          project-id: ${{ env.BRIDGEDAI_PROJECT_ID }}
          build-id: ${{ steps.bridgedai-register-build.outputs.build-id }}
          runner-id: ${{ steps.bridgedai-register-runner.outputs.runner-id }}
          repo-full-name: ${{ github.repository }}
          workflow-run-id: ${{ github.run_id }}
          commit-sha: ${{ github.sha }}
          branch: ${{ github.ref_name }}
          artifact-name: ${{ github.event.repository.name }}
          artifact-type: source_archive
          artifact-path: package.json
          artifact-digest: ${{ steps.bridgedai-subject.outputs.subject-digest }}
          mode: production
          fail-on-error: false
          emit-demo-signals: false
      - name: "BridgedAI SBOM"
        id: bridgedai-sbom
        uses: bridgedai-devsecops/sbom-action@v0.0.6-beta
        with:
          subject: .
          subject-type: file
          format: spdx-json
          output-file: .bridgedai/sbom.spdx.json
          organization-id: ${{ env.BRIDGEDAI_ORG_ID }}
          emit-demo-signals: false
          fail-on-error: true
      - name: "Trivy filesystem vulnerability scan"
        id: trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: json
          output: .bridgedai/trivy-results.json
          severity: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL
          ignore-unfixed: false
          exit-code: 0
      - name: "Synthesize BridgedAI build and vulnerability signals"
        env:
          BRIDGEDAI_SIGNAL_FILE: .bridgedai/signals.jsonl
          BRIDGEDAI_TRIVY_JSON: .bridgedai/trivy-results.json
          BRIDGEDAI_ORG_ID: ${{ env.BRIDGEDAI_ORG_ID }}
          BRIDGEDAI_PROJECT_ID: ${{ env.BRIDGEDAI_PROJECT_ID }}
          BRIDGEDAI_ARTIFACT_DIGEST: ${{ steps.bridgedai-subject.outputs.subject-digest }}
          BRIDGEDAI_ARTIFACT_NAME: ${{ github.event.repository.name }}
          BRIDGEDAI_ARTIFACT_TYPE: source_archive
          BRIDGEDAI_NEEDS_JSON: ${{ toJson(needs) }}
          BRIDGEDAI_ENVIRONMENT: ${{ env.BRIDGEDAI_ENVIRONMENT }}
        run: node .github/scripts/bridgedai-signals.mjs
      - name: "BridgedAI Attest"
        id: bridgedai-attest
        uses: bridgedai-devsecops/attest-action@v0.0.6-beta
        with:
          subject-name: ${{ steps.bridgedai-subject.outputs.subject-name }}
          subject-digest: ${{ steps.bridgedai-subject.outputs.subject-digest }}
          predicate-type: https://spdx.dev/Document
          predicate-file: .bridgedai/sbom.spdx.json
          attestation-file: .bridgedai/attestation.json
          mode: create-only
      - name: "GitHub artifact attestation"
        id: github-attestation
        uses: actions/attest-build-provenance@v2
        continue-on-error: true
        with:
          subject-path: package.json
      - name: "BridgedAI Upload Evidence"
        id: bridgedai-upload-evidence
        uses: bridgedai-devsecops/upload-evidence-action@v0.0.6-beta
        with:
          api-base: ${{ env.BRIDGEDAI_API_URL }}
          access-token: ${{ steps.bridgedai-auth.outputs.access-token }}
          api-key: ${{ steps.bridgedai-auth.outputs.api-key }}
          org-id: ${{ env.BRIDGEDAI_ORG_ID }}
          repo-full-name: ${{ github.repository }}
          workflow-run-id: ${{ github.run_id }}
          commit-sha: ${{ github.sha }}
          branch: ${{ github.ref_name }}
          project-id: ${{ env.BRIDGEDAI_PROJECT_ID }}
          build-id: ${{ steps.bridgedai-register-build.outputs.build-id }}
          artifact-name: ${{ github.event.repository.name }}
          artifact-digest: ${{ steps.bridgedai-subject.outputs.subject-digest }}
          sbom-path: .bridgedai/sbom.spdx.json
          attestation-path: .bridgedai/attestation.json
          signal-file: .bridgedai/signals.jsonl
          evidence-file: .bridgedai/context.json
          resolve-build: false
          emit-demo-signals: false
          fail-on-upload-error: true
      - name: "BridgedAI Verify Evidence"
        if: ${{ steps.bridgedai-auth.outputs.api-key != '' }}
        id: bridgedai-verify-evidence
        uses: bridgedai-devsecops/verify-evidence-action@v0.0.6-beta
        with:
          api-base: ${{ env.BRIDGEDAI_API_URL }}
          api-key: ${{ steps.bridgedai-auth.outputs.api-key }}
          org-id: ${{ env.BRIDGEDAI_ORG_ID }}
          mode: build-summary
          build-id: ${{ steps.bridgedai-register-build.outputs.build-id }}
          offline: false
          fail-on-not-verified: false
      - name: "BridgedAI Evaluate Policy"
        id: bridgedai-evaluate-policy
        uses: bridgedai-devsecops/evaluate-policy-action@v0.0.6-beta
        with:
          api-url: ${{ env.BRIDGEDAI_API_URL }}
          access-token: ${{ steps.bridgedai-auth.outputs.access-token }}
          api-key: ${{ steps.bridgedai-auth.outputs.api-key }}
          tenant: ${{ env.BRIDGEDAI_ORG_ID }}
          org-id: ${{ env.BRIDGEDAI_ORG_ID }}
          repo-full-name: ${{ github.repository }}
          workflow-run-id: ${{ github.run_id }}
          commit-sha: ${{ github.sha }}
          branch: ${{ github.ref_name }}
          build-id: ${{ steps.bridgedai-register-build.outputs.build-id }}
          artifact-digest: ${{ steps.bridgedai-subject.outputs.subject-digest }}
          policy: ${{ env.BRIDGEDAI_POLICY }}
          environment: ${{ env.BRIDGEDAI_ENVIRONMENT }}
      - name: "BridgedAI Release Gate"
        id: bridgedai-release-gate
        uses: bridgedai-devsecops/release-gate-action@v0.0.6-beta
        with:
          integration: local
          organization-id: ${{ env.BRIDGEDAI_ORG_ID }}
          decision: ${{ steps.bridgedai-evaluate-policy.outputs.decision }}
          score: ${{ steps.bridgedai-evaluate-policy.outputs.score }}
          reason: ${{ steps.bridgedai-evaluate-policy.outputs.reason }}
          mode: ${{ env.BRIDGEDAI_GATE_MODE }}
          policy-id: ${{ env.BRIDGEDAI_POLICY }}
          policy-result-file: ${{ steps.bridgedai-evaluate-policy.outputs.policy-result-file }}
          fail-on-deny: true
      - name: "BridgedAI Deployment Guard"
        id: bridgedai-deployment-guard
        uses: bridgedai-devsecops/deployment-guard-action@v0.0.6-beta
        with:
          api-url: ${{ env.BRIDGEDAI_API_URL }}
          access-token: ${{ steps.bridgedai-auth.outputs.access-token }}
          api-key: ${{ steps.bridgedai-auth.outputs.api-key }}
          tenant: ${{ env.BRIDGEDAI_ORG_ID }}
          org-id: ${{ env.BRIDGEDAI_ORG_ID }}
          environment: ${{ env.BRIDGEDAI_ENVIRONMENT }}
          gate-mode: ${{ env.BRIDGEDAI_GATE_MODE }}
          artifact-digest: ${{ steps.bridgedai-subject.outputs.subject-digest }}
          policy-id: ${{ env.BRIDGEDAI_POLICY }}
          build-id: ${{ steps.bridgedai-register-build.outputs.build-id }}
          repo-full-name: ${{ github.repository }}
          workflow-run-id: ${{ github.run_id }}
          commit-sha: ${{ github.sha }}
          branch: ${{ github.ref_name }}
          project-id: ${{ env.BRIDGEDAI_PROJECT_ID }}
      - name: "BridgedAI Register Deployment"
        id: bridgedai-register-deployment
        uses: bridgedai-devsecops/register-deployment-action@v0.0.6-beta
        with:
          api-url: ${{ env.BRIDGEDAI_API_URL }}
          access-token: ${{ steps.bridgedai-auth.outputs.access-token }}
          api-key: ${{ steps.bridgedai-auth.outputs.api-key }}
          tenant: ${{ env.BRIDGEDAI_ORG_ID }}
          organization-id: ${{ env.BRIDGEDAI_ORG_ID }}
          environment: ${{ env.BRIDGEDAI_ENVIRONMENT }}
          digest: ${{ steps.bridgedai-subject.outputs.subject-digest }}
          service: ${{ github.event.repository.name }}
          policy-result-id: ${{ steps.bridgedai-evaluate-policy.outputs.policy-result-id }}
          deployment-system: github-actions
          status: ${{ needs.e2e-test.result == 'success' && needs.docker-test.result == 'success' && 'completed' || 'failed' }}
          mode: observe
          emit-demo-signals: false
      - name: "BridgedAI Upload Governance Decision Signals"
        id: bridgedai-upload-governance-signals
        uses: bridgedai-devsecops/upload-evidence-action@v0.0.6-beta
        with:
          api-base: ${{ env.BRIDGEDAI_API_URL }}
          access-token: ${{ steps.bridgedai-auth.outputs.access-token }}
          api-key: ${{ steps.bridgedai-auth.outputs.api-key }}
          org-id: ${{ env.BRIDGEDAI_ORG_ID }}
          repo-full-name: ${{ github.repository }}
          workflow-run-id: ${{ github.run_id }}
          commit-sha: ${{ github.sha }}
          branch: ${{ github.ref_name }}
          project-id: ${{ env.BRIDGEDAI_PROJECT_ID }}
          build-id: ${{ steps.bridgedai-register-build.outputs.build-id }}
          signal-file: .bridgedai/signals.jsonl
          resolve-build: false
          emit-demo-signals: false
          fail-on-upload-error: true
  docker:
    if: github.repository == 'juice-shop/juice-shop' && github.event_name == 'push' && (github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/master')
    needs: [frontend-test, server-test, api-test, e2e-test, custom-config-test, docker-test, bridgedai-governance]
    runs-on: ubuntu-latest
    steps:
      - name: "Check out Git repository"
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 #v4.2.2
      - name: "Set up QEMU"
        uses: docker/setup-qemu-action@49b3bc8e6bdd4a60e6116a5414239cba5943d3cf #v3.2.0
      - name: "Set up Docker Buildx"
        uses: docker/setup-buildx-action@6524bf65af31da8d45b59e8c27de4bd072b392f5 #v3.8.0
      - name: "Login to DockerHub"
        uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567 #v3.3.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: "Set tag & labels for ${{ github.ref }}"
        run: |
          if [ "$GITHUB_REF" == "refs/heads/master" ]; then
          echo "DOCKER_TAG=latest" >> $GITHUB_ENV
          else
          echo "DOCKER_TAG=snapshot" >> $GITHUB_ENV
          fi
          echo "VCS_REF=`git rev-parse --short HEAD`" >> $GITHUB_ENV
          echo "BUILD_DATE=`date -u +”%Y-%m-%dT%H:%M:%SZ”`" >> $GITHUB_ENV
      - name: "Build and push for AMD64 and ARM64 processors"
        uses: docker/build-push-action@48aba3b46d1b1fec4febb7c5d0c644b249a11355 #v6.1.0
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            bkimminich/juice-shop:${{ env.DOCKER_TAG }}
          build-args: |
            VCS_REF=${{ env.VCS_REF }}
            BUILD_DATE=${{ env.BUILD_DATE }}
            CYCLONEDX_NPM_VERSION=${{ env.CYCLONEDX_NPM_VERSION }}
  heroku:
    if: github.repository == 'juice-shop/juice-shop' && github.event_name == 'push' && (github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/master')
    needs: [frontend-test, server-test, api-test, e2e-test, custom-config-test, bridgedai-governance]
    runs-on: ubuntu-latest
    steps:
      - name: "Check out Git repository"
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 #v4.2.2
      - name: "Install Heroku CLI"
        run: curl https://cli-assets.heroku.com/install.sh | sh
      - name: "Set Heroku app & branch for ${{ github.ref }}"
        run: |
          if [ "$GITHUB_REF" == "refs/heads/master" ]; then
          echo "HEROKU_APP=juice-shop" >> $GITHUB_ENV
          echo "HEROKU_BRANCH=master" >> $GITHUB_ENV
          else
          echo "HEROKU_APP=juice-shop-staging" >> $GITHUB_ENV
          echo "HEROKU_BRANCH=develop" >> $GITHUB_ENV
          fi
      - name: "Deploy ${{ github.ref }} to Heroku"
        uses: akhileshns/heroku-deploy@581dd286c962b6972d427fcf8980f60755c15520 #v3.13.15
        with:
          heroku_api_key: ${{ secrets.HEROKU_API_KEY }}
          heroku_app_name: ${{ env.HEROKU_APP }}
          heroku_email: bjoern.kimminich@owasp.org
          branch: ${{ env.HEROKU_BRANCH }}
  notify-slack:
    if: github.repository == 'juice-shop/juice-shop' && github.event_name == 'push' && (success() || failure())
    needs:
      - docker
      - bridgedai-governance
      - heroku
      - lint
      - coding-challenge-rsn
      - smoke-test
      - coverage-report
    runs-on: ubuntu-latest
    steps:
      - name: "Slack workflow notification"
        uses: Gamesight/slack-workflow-status@68bf00d0dbdbcb206c278399aa1ef6c14f74347a #v1.3.0
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          slack_webhook_url: ${{ secrets.SLACK_WEBHOOK_URL }}
